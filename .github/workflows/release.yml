# Release workflow for CoilPro
#
# Triggered by pushing a version tag (e.g. `v0.1.0-preview.1`). Builds, tests,
# packs the libraries and the `coilpro` dotnet tool, and publishes them to NuGet.org.
# MinVer reads the version from the tag (MinVerTagPrefix=v, Directory.Build.props).
#
# Publishing uses NuGet Trusted Publishing (OIDC): no long-lived API key is stored
# in the repository. nuget.org account "dotnetservices" has a trusted publishing
# policy for repository machine1986/CoilPro, workflow file release.yml; the
# NuGet/login action exchanges the job's GitHub OIDC token for a NuGet API key
# that is valid for one hour.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # GitHub OIDC token for NuGet Trusted Publishing

env:
  # Directory the packed .nupkg/.snupkg files are written to.
  PACKAGE_OUTPUT_DIR: ${{ github.workspace }}/artifacts/packages

jobs:
  pack-and-publish:
    # Publish only from the public SDK repository, so SourceLink and package metadata point at it.
    # The private working repo carries the same workflow file but must never publish.
    if: github.repository == 'machine1986/CoilPro'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # MinVer derives the package version from git tags, so the full
          # history/tags (not just the tagged commit) must be available.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Libraries multi-target net8.0;net10.0 (see Directory.Build.props).
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      # Never publish a build whose tests fail.
      - name: Test (Release)
        run: dotnet test --configuration Release --no-build

      # Pack the libraries and the CLI tool; samples and tests are not packable.
      - name: Pack CoilPro
        run: >
          dotnet pack src/CoilPro/CoilPro.csproj
          --configuration Release
          --no-build
          --output "${{ env.PACKAGE_OUTPUT_DIR }}"

      - name: Pack CoilPro.Commands
        run: >
          dotnet pack src/CoilPro.Commands/CoilPro.Commands.csproj
          --configuration Release
          --no-build
          --output "${{ env.PACKAGE_OUTPUT_DIR }}"

      - name: Pack CoilPro.AspNetCore
        run: >
          dotnet pack src/CoilPro.AspNetCore/CoilPro.AspNetCore.csproj
          --configuration Release
          --no-build
          --output "${{ env.PACKAGE_OUTPUT_DIR }}"

      - name: Pack CoilPro.Cli (dotnet tool)
        run: >
          dotnet pack tools/CoilPro.Cli/CoilPro.Cli.csproj
          --configuration Release
          --no-build
          --output "${{ env.PACKAGE_OUTPUT_DIR }}"

      - name: List packages
        run: ls -la "${{ env.PACKAGE_OUTPUT_DIR }}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            ${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg
            ${{ env.PACKAGE_OUTPUT_DIR }}/*.snupkg

      # Exchange the GitHub OIDC token for a short-lived NuGet API key (valid 1 h),
      # requested right before the push so it cannot expire in between.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: dotnetservices

      # `dotnet nuget push` with a glob also pushes each sibling .snupkg symbol package.
      - name: Push packages to NuGet.org
        run: >
          dotnet nuget push "${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg"
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
