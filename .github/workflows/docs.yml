# Builds the DocFX site (docs/) and deploys it to GitHub Pages.
#
# MANUAL PREP STEP: enable Pages once under Settings > Pages > Build and
# deployment > Source: "GitHub Actions". Without it, the deploy job fails.
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/**"
      - ".config/dotnet-tools.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Docs are published from the public SDK repository only (GitHub Pages is not enabled in the
    # private working repo).
    if: github.repository == 'machine1986/CoilPro'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x

      - name: Restore local tools (docfx)
        run: dotnet tool restore

      - name: Build DocFX site
        run: dotnet docfx docs/docfx.json

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
