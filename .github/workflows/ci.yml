# Continuous Integration for Coil.NET
#
# Builds and tests the solution on every push and pull request targeting main.
# Runs against the full multi-target matrix (net10.0 + net8.0) so both the
# library's target frameworks are exercised by the test suite.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. new commits on a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # MinVer derives the package version from git history/tags, so the
          # full history (not just the last commit) must be available.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Libraries multi-target net8.0;net10.0 (see Directory.Build.props) —
          # both SDKs/runtimes are needed to restore, build, and run tests.
          dotnet-version: |
            10.0.x
            8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Test (Release)
        run: dotnet test --configuration Release --no-build --verbosity normal
